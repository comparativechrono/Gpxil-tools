[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gpxiltools"
dynamic = ["version"]
description = "Read, write and render gpxil genome pixel images (one pixel per base, stored as TIFF)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chronomic Medicine Group, Department of Genomic Medicine, University of Cambridge" }]
keywords = ["genomics", "genome", "visualisation", "image", "tiff", "vcf", "fasta"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "tifffile>=2023.7.10",
    # Zstandard, LZW and PackBits; deflate, the default, needs only Python. Pyodide (Python in the browser) has no build of it.
    "imagecodecs>=2023.1.23; sys_platform != 'emscripten'",
    "Pillow>=10.0",
    "jsonschema>=4",
]

[project.optional-dependencies]
test = ["pytest>=7", "pysam>=0.22", "pikepdf"]
bench = ["matplotlib", "zarr>=2.16"]

[project.scripts]
gpxil = "gpxiltools.cli:main"

[project.urls]
Specification = "https://github.com/comparativechrono/Gpxil"
Source = "https://github.com/comparativechrono/Gpxil-tools"

[tool.hatch.version]
path = "src/gpxiltools/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gpxiltools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
extend-exclude = ["*.ipynb"]  # generated by examples/make_quickstart_notebook.py, which is linted

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B"]
ignore = ["B905"]  # zip() over FORMAT keys and values is deliberately not strict (VCF allows trailing fields to be dropped)
