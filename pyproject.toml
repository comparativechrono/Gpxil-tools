[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "gpxiltools"
dynamic = ["version"]
description = "Read, write and render gpxil genome pixel images (one pixel per base, stored as TIFF)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "gpxil contributors" }]
keywords = ["genomics", "genome", "visualisation", "image", "tiff", "vcf", "fasta"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "tifffile>=2023.7.10",
    "imagecodecs>=2023.1.23",
    "Pillow>=10.0",
]

[project.optional-dependencies]
test = ["pytest>=7", "pysam>=0.22", "jsonschema>=4", "pikepdf"]
bench = ["matplotlib", "zarr>=2.16"]

[project.scripts]
gpxil = "gpxiltools.cli:main"

[project.urls]
Specification = "https://github.com/comparativechrono/Gpxil"
Source = "https://github.com/comparativechrono/Gpxil-tools"

[tool.hatch.version]
path = "src/gpxiltools/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gpxiltools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
